name: Build WordPress Plugin ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and attach plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare plugin folder
        run: |
          PLUGIN_SLUG="bloglogistics-limited-blog-writing-access"
          BUILD_DIR="/tmp/${PLUGIN_SLUG}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"

          rsync -av \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="${PLUGIN_SLUG}.zip" \
            ./ "${BUILD_DIR}/"

      - name: Create ZIP
        run: |
          PLUGIN_SLUG="bloglogistics-limited-blog-writing-access"
          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_SLUG="bloglogistics-limited-blog-writing-access"
          gh release upload "${{ github.event.release.tag_name }}" "${PLUGIN_SLUG}.zip" --clobber

      - name: Upload ZIP as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bloglogistics-limited-blog-writing-access
          path: bloglogistics-limited-blog-writing-access.zip

      - name: Build update manifest
        if: github.event_name == 'release'
        run: |
          python3 <<'PY'
          import datetime
          import html
          import json
          import re
          from pathlib import Path

          plugin_name = "BlogLogistics Limited Blog Writing Access"
          plugin_slug = "bloglogistics-limited-blog-writing-access"
          repo_url = "https://github.com/bloglogisticsdev/bloglogistics-limited-blog-writing-access"
          tag_name = "${{ github.event.release.tag_name }}"
          version = tag_name.lstrip("v")
          download_url = f"{repo_url}/releases/download/v{version}/{plugin_slug}.zip"
          last_updated = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          readme_path = Path("readme.txt")
          readme = readme_path.read_text(encoding="utf-8", errors="replace")

          changelog_match = re.search(
              r"^==\s*Changelog\s*==\s*(.*?)(?=^==\s+|\Z)",
              readme,
              flags=re.IGNORECASE | re.MULTILINE | re.DOTALL,
          )

          changelog_text = changelog_match.group(1).strip() if changelog_match else ""

          html_parts = []
          current_items = []

          def flush_items():
              nonlocal_items = list(current_items)
              current_items.clear()
              if nonlocal_items:
                  html_parts.append("<ul>")
                  for item in nonlocal_items:
                      html_parts.append(f"<li>{html.escape(item)}</li>")
                  html_parts.append("</ul>")

          for raw_line in changelog_text.splitlines():
              line = raw_line.strip()
              if not line:
                  continue

              version_heading = re.match(r"^=\s*(.*?)\s*=$", line)
              if version_heading:
                  flush_items()
                  html_parts.append(f"<h4>{html.escape(version_heading.group(1))}</h4>")
                  continue

              if line.startswith("*"):
                  current_items.append(line.lstrip("*").strip())
                  continue

              current_items.append(line)

          flush_items()

          changelog_html = "".join(html_parts) if html_parts else "<p>No changelog available.</p>"

          installation_html = """<ol><li>Upload and activate BlogLogistics Limited Blog Writing Access.</li><li>Go to <strong>BlogLogistics &gt; Limited Blog Writing Access</strong>.</li><li>Review the available protections and leave the recommended defaults on, or adjust the settings for the site.</li><li>Test with a limited writing role, such as Editor, Author, or Contributor, to confirm the expected wp-admin restrictions are active.</li></ol>"""

          faq_html = """<h4>What does this plugin do?</h4><p>It helps limit what selected writing roles can access in wp-admin. It can restrict wp-admin access, media tools, publishing tools, comment moderation, and supported third-party content tools.</p><h4>Are the protections on by default?</h4><p>Yes. The recommended protections are turned on by default when the plugin is activated for the first time.</p><h4>Where are the settings?</h4><p>The settings are available under <strong>BlogLogistics &gt; Limited Blog Writing Access</strong>.</p><h4>Can administrators still access everything?</h4><p>Yes. The restrictions are designed for non-administrators and limited writing roles. Administrators keep normal access.</p><h4>What happens if I delete the plugin?</h4><p>The plugin removes its saved settings during uninstall. It does not delete posts, pages, users, or content.</p>"""

          manifest = {
              "name": plugin_name,
              "version": version,
              "download_url": download_url,
              "homepage": repo_url,
              "author": "<a href=\"https://www.bloglogistics.com\" target=\"_blank\" rel=\"noopener noreferrer\">BlogLogistics</a>",
              "author_profile": "https://www.bloglogistics.com",
              "requires": "7.0",
              "tested": "7.0",
              "requires_php": "8.3",
              "last_updated": last_updated,
              "icons": {
                  "1x": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
                  "2x": "https://updates.bloglogistics.com/plugins/assets/icon-256x256.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/icon-128x128.png",
              },
              "banners": {
                  "low": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
                  "high": "https://updates.bloglogistics.com/plugins/assets/banner-1544x500.png",
                  "default": "https://updates.bloglogistics.com/plugins/assets/banner-772x250.png",
              },
              "sections": {
                  "description": "Allows selected writing roles to create blog posts while preventing media access, uploads, publishing, comment moderation, and broader wp-admin access.",
                  "installation": installation_html,
                  "faq": faq_html,
                  "changelog": changelog_html,
              },
          }

          output_path = Path(f"{plugin_slug}.json")
          output_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(output_path.read_text(encoding="utf-8"))
          PY

      - name: Upload update manifest by FTPS
        if: github.event_name == 'release'
        env:
          FTP_SERVER: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.BLOGLOGISTICS_UPDATES_FTP_SERVER_DIR }}
        run: |
          PLUGIN_SLUG="bloglogistics-limited-blog-writing-access"

          sudo apt-get update
          sudo apt-get install -y lftp

          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" "${FTP_SERVER}" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          cd "${FTP_SERVER_DIR}"
          put "${PLUGIN_SLUG}.json" -o "${PLUGIN_SLUG}.json"
          bye
          EOF
